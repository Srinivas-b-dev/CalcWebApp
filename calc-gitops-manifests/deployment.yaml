apiVersion: apps/v1
kind: Deployment
metadata:
  name: calc-web-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
      - name: calculator
        image: YOUR_DOCKERHUB_USERNAME/calcwebapp:latest # Jenkins automatically rewrites this tag
        ports:
        - name: calc-port
          containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: calc-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: calculator